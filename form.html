<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Startup 活动报名</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --card: #12121a;
      --border: #2a2a3a;
      --text: #e8e8ed;
      --muted: #8888a0;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.15), transparent);
    }
    .container {
      width: 100%;
      max-width: 440px;
    }
    .header {
      text-align: center;
      margin-bottom: 32px;
    }
    .badge {
      display: inline-block;
      background: rgba(99, 102, 241, 0.2);
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.5);
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      transition: border-color 0.2s;
    }
    input::placeholder { color: var(--muted); opacity: 0.7; }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }
    button {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      color: white;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .message {
      text-align: center;
      padding: 16px;
      border-radius: 10px;
      font-size: 14px;
      margin-top: 20px;
      display: none;
    }
    .message.success {
      display: block;
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
    }
    .message.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
    }
    .footer {
      text-align: center;
      margin-top: 24px;
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="badge">AI Startup</span>
      <h1>免费 1 个月 Token 申请</h1>
      <p class="subtitle">填写信息，我们将筛选优质初创团队并发放额度</p>
    </div>
    <div class="card">
      <form id="signup-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
        <input type="hidden" name="_subject" value="AI Startup 活动报名 - 新申请">
        <div class="form-group">
          <label for="company">Company Name / 公司名称 <span style="color:#ef4444">*</span></label>
          <input type="text" id="company" name="company" placeholder="Your startup name" required>
        </div>
        <div class="form-group">
          <label for="firstName">First Name / 名 <span style="color:#ef4444">*</span></label>
          <input type="text" id="firstName" name="firstName" placeholder="First name" required>
        </div>
        <div class="form-group">
          <label for="lastName">Last Name / 姓 <span style="color:#ef4444">*</span></label>
          <input type="text" id="lastName" name="lastName" placeholder="Last name" required>
        </div>
        <div class="form-group">
          <label for="email">Work Email / 工作邮箱 <span style="color:#ef4444">*</span></label>
          <input type="email" id="email" name="email" placeholder="you@company.com" required>
        </div>
        <div class="form-group">
          <label for="phone">Phone Number / 电话 <span style="color:#ef4444">*</span></label>
          <input type="tel" id="phone" name="phone" placeholder="+86 或 区号+号码" required>
        </div>
        <button type="submit" id="submit-btn">提交申请</button>
      </form>
      <div id="message" class="message" role="alert"></div>
    </div>
    <p class="footer">提交后我们会在 1–3 个工作日内与您联系</p>
  </div>
  <script>
    document.getElementById('signup-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const msg = document.getElementById('message');
      btn.disabled = true;
      msg.className = 'message';
      msg.textContent = '';
      const form = e.target;
      const data = new FormData(form);
      try {
        const res = await fetch(form.action, { method: 'POST', body: data, headers: { Accept: 'application/json' } });
        if (res.ok) {
          msg.className = 'message success';
          msg.textContent = '提交成功！我们会尽快与您联系。';
          form.reset();
        } else {
          const err = await res.json();
          msg.className = 'message error';
          msg.textContent = err.error || '提交失败，请稍后重试。';
        }
      } catch (_) {
        msg.className = 'message error';
        msg.textContent = '网络错误，请检查网络后重试。';
      }
      btn.disabled = false;
    });
  </script>
</body>
</html>
