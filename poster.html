<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Startup 活动海报</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      background: #1a1a2e;
      color: #eee;
    }
    .controls {
      margin-bottom: 24px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .controls label { font-size: 14px; color: #aaa; }
    .controls input {
      padding: 8px 12px;
      width: 280px;
      font-size: 14px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #0f0f1a;
      color: #eee;
    }
    .controls button {
      padding: 8px 16px;
      font-size: 14px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .controls button:hover { background: #818cf8; }
    #poster {
      width: 720px;
      max-width: 100%;
      aspect-ratio: 3/4;
      background: linear-gradient(165deg, #0f0f1a 0%, #1a1a2e 40%, #16213e 100%);
      border: 1px solid #2a2a4a;
      border-radius: 24px;
      padding: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 32px 64px -16px rgba(0,0,0,0.6);
    }
    .poster-top {
      text-align: center;
    }
    .poster-badge {
      display: inline-block;
      background: rgba(99, 102, 241, 0.25);
      color: #a5b4fc;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 20px;
    }
    .poster-title {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #fff 0%, #c7d2fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .poster-subtitle {
      font-size: 1.1rem;
      color: #94a3b8;
      font-weight: 500;
    }
    .poster-offer {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(129, 140, 248, 0.1) 100%);
      border: 1px solid rgba(99, 102, 241, 0.4);
      border-radius: 16px;
      padding: 20px 32px;
      margin: 24px 0;
      font-size: 1.25rem;
      font-weight: 600;
      color: #c7d2fe;
    }
    .poster-qr-wrap {
      width: 160px;
      height: 160px;
      padding: 12px;
      background: #fff;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .poster-qr-wrap canvas { display: block; }
    .poster-qr-placeholder {
      width: 136px;
      height: 136px;
      background: #e2e8f0;
      border: 2px dashed #94a3b8;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #64748b;
      text-align: center;
      padding: 12px;
    }
    .poster-cta {
      font-size: 14px;
      color: #94a3b8;
      margin-top: 12px;
    }
    .poster-footer {
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="controls">
    <label for="form-url">表单链接（用于生成二维码）：</label>
    <input type="url" id="form-url" placeholder="https://你的表单页面地址/form.html">
    <button type="button" id="gen-btn">生成海报二维码</button>
  </div>
  <div id="poster">
    <div class="poster-top">
      <div class="poster-badge">AI Startup Program</div>
      <h1 class="poster-title">AI 初创公司扶持计划</h1>
      <p class="poster-subtitle">为有潜力的初创团队赋能</p>
      <div class="poster-offer">🎁 1 个月免费 Token</div>
    </div>
    <div class="poster-qr-wrap">
      <div id="qr-placeholder" class="poster-qr-placeholder">在此处显示二维码<br>请在上方输入表单链接并点击生成</div>
      <div id="qr-container" style="display:none;"></div>
    </div>
    <p class="poster-cta">扫码填写表单 · 提交申请</p>
    <p class="poster-footer">我们将在 1–3 个工作日内与您联系</p>
  </div>
  <script>
    const formUrl = document.getElementById('form-url');
    const genBtn = document.getElementById('gen-btn');
    const placeholder = document.getElementById('qr-placeholder');
    const container = document.getElementById('qr-container');

    genBtn.addEventListener('click', function() {
      const url = (formUrl.value || '').trim();
      if (!url) {
        alert('请先填写表单页面链接');
        return;
      }
      placeholder.style.display = 'none';
      container.style.display = 'flex';
      container.style.justifyContent = 'center';
      container.style.alignItems = 'center';
      container.innerHTML = '';
      var img = document.createElement('img');
      img.alt = 'QR Code';
      img.style.width = img.style.height = '136px';
      img.src = '/qr?url=' + encodeURIComponent(url);
      img.onerror = function() {
        placeholder.style.display = 'flex';
        container.style.display = 'none';
        container.innerHTML = '';
        alert('二维码加载失败，请稍后重试');
      };
      container.appendChild(img);
    });
  </script>
</body>
</html>
